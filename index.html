<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Causa Raíz - SST</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #f59e0b;
            --text-color: #e5e7eb;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .porque-box {
            background: #171e2e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .porque-box.causa-raiz {
            border: 2px solid var(--accent-yellow);
            background: #241a08;
        }

        .badge {
            background: #d97706;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .porque-box.causa-raiz .badge {
            background: var(--accent-yellow);
            color: #000;
        }

        .content {
            flex-grow: 1;
        }

        .question {
            font-weight: bold;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .answer {
            color: #f3f4f6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Análisis de Causa Raíz: Método de los 5 Porqués (SST)</h2>
    
    <div class="input-section">
        <label for="incidente">Descripción del Incidente / Accidente:</label>
        <textarea id="incidente" placeholder="Ingrese el reporte del incidente...">El día 22/09/2026, el colaborador Evel Tavara sufrió una herida superficial en la mano izquierda por descarga de pintura a presión al intentar desobstruir la boquilla de la pistola manteniendo los dedos en el gatillo y posicionando la mano en la línea de fuego.</textarea>
        <button onclick="generarAnalisisSST()">Analizar Causa Raíz</button>
    </div>

    <div id="contenedor-porques">
        <!-- Resultados generados dinámicamente -->
    </div>
</div>

<script>
function generarAnalisisSST() {
    const descripcion = document.getElementById('incidente').value;
    const contenedor = document.getElementById('contenedor-porques');
    
    if (!descripcion.trim()) {
        alert("Por favor ingrese la descripción de un incidente.");
        return;
    }

    // Lógica del Experto SST adaptada al evento
    const analisisSST = [
        {
            num: "1º Porqué",
            pregunta: "¿Por qué ocurrió el incidente?",
            respuesta: "Se produjo una descarga de pintura a alta presión que impactó directamente en la mano izquierda del trabajador, ocasionando una lesión superficial."
        },
        {
            num: "2º Porqué",
            pregunta: "¿Por qué ocurrió la descarga sobre la mano?",
            respuesta: "El trabajador posicionó la mano izquierda en la línea de fuego (frente a la boquilla) mientras sostenía la pistola con la mano derecha manteniendo los dedos sobre el gatillo."
        },
        {
            num: "3º Porqué",
            pregunta: "¿Por qué se expuso a la línea de fuego?",
            respuesta: "El operario intentó desobstruir y regular la boquilla de forma manual e intempestiva sin antes aislar/despresurizar el equipo ni bloquear el gatillo de seguridad."
        },
        {
            num: "4º Porqué",
            pregunta: "¿Por qué no se aplicó el procedimiento seguro?",
            respuesta: "Falta de adherencia a los estándares de trabajo seguro (PETS) e IPERC para intervención de equipos con fluidos/aire a alta presión."
        },
        {
            num: "5º Porqué (Causa Raíz)",
            pregunta: "¿Por qué falló el control de seguridad?",
            respuesta: "Causa Raíz: Deficiencia en el programa de capacitación práctica sobre liberación de presiones residuales y supervisión operativa para la corrección oportuna de actos subestándar en planta.",
            esRaiz: true
        }
    ];

    // Renderizar en el DOM
    contenedor.innerHTML = "";
    analisisSST.forEach(item => {
        const div = document.createElement('div');
        div.className = `porque-box ${item.esRaiz ? 'causa-raiz' : ''}`;
        div.innerHTML = `
            <span class="badge">${item.num}</span>
            <div class="content">
                <div class="question">${item.pregunta}</div>
                <div class="answer">${item.respuesta}</div>
            </div>
        `;
        contenedor.appendChild(div);
    });
}

// Generar al cargar la página por primera vez
window.onload = generarAnalisisSST;
</script>

</body>
</html>
