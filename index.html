<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador Dinámico de Seguridad SST</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-color: #e5e7eb;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .selector-tipo {
            display: flex;
            gap: 15px;
            margin: 10px 0 15px 0;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: #1f2937;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #374151;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .radio-label:hover {
            border-color: var(--accent-blue);
        }

        .radio-label input[type="radio"] {
            accent-color: var(--accent-yellow);
        }

        .btn-analizar {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-analizar:hover {
            background-color: #4338ca;
        }

        /* Estilos Metodología SCAT */
        .scat-card {
            background: #171e2e;
            border-left: 4px solid var(--accent-blue);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .scat-card.critico {
            border-left-color: var(--accent-red);
        }

        .scat-card.raiz {
            border-left-color: var(--accent-yellow);
            background: #241a08;
        }

        .scat-title {
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        /* Estilos Metodología 5 Porqués */
        .porque-box {
            background: #171e2e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .porque-box.causa-raiz {
            border: 2px solid var(--accent-yellow);
            background: #241a08;
        }

        .badge {
            background: #d97706;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .porque-box.causa-raiz .badge {
            background: var(--accent-yellow);
            color: #000;
        }

        .content-text {
            color: #f3f4f6;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Módulo de Investigación de Incidentes & Accidentes (SST)</h2>
    
    <div class="input-section">
        <label for="incidente">Descripción del Evento:</label>
        <textarea id="incidente" placeholder="Ingrese la descripción del evento para analizar...">El día 22/09/2026, a las 15:20 horas, el colaborador Evel Tavara realizaba labores de pintado de un contenedor. La pistola se obstruyó y el trabajador procedió a ajustar la boquilla de forma manual sosteniendo el cuerpo con la mano derecha (dedos en el gatillo) y la mano izquierda frente a la boquilla. Accionó involuntariamente el gatillo, generando una descarga a presión que provocó una lesión superficial en su mano izquierda.</textarea>
        
        <div class="selector-tipo">
            <span style="font-weight: 600; font-size: 0.9rem;">Tipificación:</span>
            <label class="radio-label">
                <input type="radio" name="tipo_evento" value="accidente" checked onchange="ejecutarAnalisisSST()"> Accidente de Trabajo (Análisis SCAT)
            </label>
            <label class="radio-label">
                <input type="radio" name="tipo_evento" value="incidente" onchange="ejecutarAnalisisSST()"> Incidente / Casi-Accidente (5 Porqués)
            </label>
        </div>

        <label for="datos_extra">Datos adicionales / Precisiones del Investigador (Opcional):</label>
        <input type="text" id="datos_extra" placeholder="Ej: No contaba con PETS firmado, omisión de bloqueo LOTO..." oninput="ejecutarAnalisisSST()">

        <button class="btn-analizar" onclick="ejecutarAnalisisSST()">Generar Análisis de Causa Raíz</button>
    </div>

    <div id="contenedor-resultados">
        <!-- Resultados generados dinámicamente -->
    </div>
</div>

<script>
// Motor NLP para extraer entidades del reporte
function procesarTexto(texto) {
    const t = texto.toLowerCase();

    // 1. Detección de Lesión / Parte afectada
    let lesion = "lesión o daño directo";
    if (t.includes("mano izquierda")) lesion = "lesión en la mano izquierda";
    else if (t.includes("mano derecha")) lesion = "lesión en la mano derecha";
    else if (t.includes("mano")) lesion = "lesión en la mano";
    else if (t.includes("ojo") || t.includes("vista")) lesion = "lesión ocular";
    else if (t.includes("pie") || t.includes("pierna")) lesion = "lesión en miembros inferiores";
    else if (t.includes("cabeza")) lesion = "traumatismo en la cabeza";
    else if (t.includes("herida")) lesion = "herida en extremidad o tejido expuesto";

    // 2. Agente / Agente de energía
    let fuenteEnergia = "liberación no controlada de energía";
    if (t.includes("presion") || t.includes("presión") || t.includes("descarga") || t.includes("pistola")) {
        fuenteEnergia = "descarga o eyección de fluido/aire a presión de la herramienta";
    } else if (t.includes("chispa") || t.includes("esmeril") || t.includes("corte")) {
        fuenteEnergia = "proyección de partículas incandescentes/materiales";
    } else if (t.includes("caida") || t.includes("caída") || t.includes("resbalon")) {
        fuenteEnergia = "energía potencial gravitacional por caída";
    }

    // 3. Acto Inseguro / Desviación
    let actos = [];
    if (t.includes("linea de fuego") || t.includes "línea de fuego" || t.includes("frente a la boquilla")) {
        actos.push("Posicionar extremidades/cuerpo directamente en la línea de fuego del equipo");
    }
    if (t.includes("gatillo") || t.includes("dedos en el gatillo")) {
        actos.push("Manipulación de la herramienta manteniendo dedos en el mecanismo de disparo");
    }
    if (t.includes("ajustar") || t.includes("manual") || t.includes("desobstruir") || t.includes("arreglar")) {
        actos.push("Intento de intervención manual/desobstrucción directa sin despresurizar o aislar el equipo");
    }
    if (actos.length === 0) actos.push("Maniobra de intervención intempestiva sin aplicar la distancia segura de trabajo");

    // 4. Condición Insegura / Evento previo
    let condicion = "Presencia de desviación técnica durante la tarea";
    if (t.includes("obstruy") || t.includes("obstrucc") || t.includes("atoro") || t.includes("falla")) {
        condición = "Atascamiento/obstrucción del flujo del equipo que interrumpió la labor habitual";
    } else if (t.includes("falta de biombo") || t.includes("limpieza")) {
        condición = "Inadecuada condición de contención en la zona de trabajo";
    }

    // 5. Involucrado
    let involucrado = "el colaborador";
    const matchNombre = texto.match(/Sr\.\s+([A-Za-z\s]+)|colaborador\s+([A-Za-z\s]+)/i);
    if (matchNombre) {
        involucrado = "el trabajador " + (matchNombre[1] || matchNombre[2]).split(" ")[0];
    }

    return { lesion, fuenteEnergia, actos, condicion, involucrado };
}

function ejecutarAnalisisSST() {
    const texto = document.getElementById('incidente').value;
    const datosExtra = document.getElementById('datos_extra').value.trim();
    const esAccidente = document.querySelector('input[name="tipo_evento"]:checked').value === 'accidente';
    const contenedor = document.getElementById('contenedor-resultados');
    
    if (!texto.trim()) {
        contenedor.innerHTML = "";
        return;
    }

    const nlp = procesarTexto(texto);
    contenedor.innerHTML = "";

    if (esAccidente) {
        // Metodología SCAT construida 100% con datos extraídos
        const analisisSCAT = [
            {
                etapa: "1. EVALUACIÓN DE LA PÉRDIDA (Daño / Lesión)",
                clase: "critico",
                detalle: `Se generó ${nlp.lesion} sufrida por ${nlp.involucrado}.`
            },
            {
                etapa: "2. EVENTO / INCIDENTE (Contacto de Riesgo)",
                clase: "",
                detalle: `Contacto e impacto por ${nlp.fuenteEnergia}.`
            },
            {
                etapa: "3. CAUSAS INMEDIATAS (Actos y Condiciones Subestándares)",
                clase: "",
                detalle: `• Acto Subestándar: ${nlp.actos.join('; ')}.\n• Condición Subestándar: ${nlp.condicion}.${datosExtra ? '\n• Precisión del Investigador: ' + datosExtra : ''}`
            },
            {
                etapa: "4. CAUSAS BÁSICAS (Factores Personales y de Trabajo)",
                clase: "",
                detalle: `• Factores Personales: Subestimación del riesgo de energía residual e intento de corregir la falla de forma improvisada.\n• Factores de Trabajo: Inexistencia o falta de claridad en el estándar de despresurización rápida para el equipo.`
            },
            {
                etapa: "5. FALLA DE CONTROL (Falta de Control Administrativo / SCAT)",
                clase: "raiz",
                detalle: `Causa Raíz SCAT: Deficiencia en el programa de capacitación en el manejo de energías peligrosas y debilidad en la supervisión operativa para prevenir actos subestándares en planta.`
            }
        ];

        analisisSCAT.forEach(item => {
            const div = document.createElement('div');
            div.className = `scat-card ${item.clase}`;
            div.innerHTML = `
                <div class="scat-title">${item.etapa}</div>
                <div class="content-text" style="white-space: pre-line;">${item.detalle}</div>
            `;
            contenedor.appendChild(div);
        });

    } else {
        // Metodología 5 Porqués (Dinámica)
        const analisis5Porques = [
            {
                num: "1º Porqué",
                pregunta: "¿Por qué ocurrió el evento?",
                respuesta: `Ocurrió una ${nlp.fuenteEnergia} que afectó la zona de trabajo de ${nlp.involucrado}.`
            },
            {
                num: "2º Porqué",
                pregunta: "¿Por qué se expuso el trabajador al riesgo?",
                respuesta: `Porque se incurrió en el siguiente acto: ${nlp.actos[0].toLowerCase()}.`
            },
            {
                num: "3º Porqué",
                pregunta: "¿Por qué se ejecutó la maniobra insegura?",
                respuesta: `Porque ante la condición de ${nlp.condicion.toLowerCase()}, se buscó resolver el inconveniente omitiendo el aislamiento/bloqueo previo.`
            },
            {
                num: "4º Porqué",
                pregunta: "¿Por qué no se aplicó el procedimiento seguro?",
                respuesta: `Falta de adherencia estricta a los estándares operativos (PETS/IPERC) durante la atención de contingencias menores.${datosExtra ? ' (' + datosExtra + ')' : ''}`
            },
            {
                num: "5º Porqué (Causa Raíz)",
                pregunta: "¿Por qué falló el control preventivo?",
                respuesta: `Causa Raíz: Ineficacia en la instrucción práctica de seguridad sobre despresurización/línea de fuego y falta de monitoreo continuo sobre las conductas operativas.`,
                esRaiz: true
            }
        ];

        analisis5Porques.forEach(item => {
            const div = document.createElement('div');
            div.className = `porque-box ${item.esRaiz ? 'causa-raiz' : ''}`;
            div.innerHTML = `
                <span class="badge">${item.num}</span>
                <div>
                    <div style="font-weight:bold; color:#9ca3af; font-size:0.85rem; margin-bottom:2px;">${item.pregunta}</div>
                    <div class="content-text">${item.respuesta}</div>
                </div>
            `;
            contenedor.appendChild(div);
        });
    }
}

// Ejecución al cargar
window.onload = ejecutarAnalisisSST;
</script>

</body>
</html>
