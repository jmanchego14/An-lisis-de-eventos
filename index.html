<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Seguridad SST - SCAT & 5 Porqués</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-color: #e5e7eb;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .selector-tipo {
            display: flex;
            gap: 15px;
            margin: 10px 0 15px 0;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: #1f2937;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #374151;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .radio-label:hover {
            border-color: var(--accent-blue);
        }

        .radio-label input[type="radio"] {
            accent-color: var(--accent-yellow);
        }

        .btn-analizar {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-analizar:hover {
            background-color: #4338ca;
        }

        /* Estilos Metodología SCAT */
        .scat-card {
            background: #171e2e;
            border-left: 4px solid var(--accent-blue);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .scat-card.critico {
            border-left-color: var(--accent-red);
        }

        .scat-card.raiz {
            border-left-color: var(--accent-yellow);
            background: #241a08;
        }

        .scat-title {
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        /* Estilos Metodología 5 Porqués */
        .porque-box {
            background: #171e2e;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .porque-box.causa-raiz {
            border: 2px solid var(--accent-yellow);
            background: #241a08;
        }

        .badge {
            background: #d97706;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .porque-box.causa-raiz .badge {
            background: var(--accent-yellow);
            color: #000;
        }

        .content-text {
            color: #f3f4f6;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Módulo de Investigación de Incidentes & Accidentes (SST)</h2>
    
    <div class="input-section">
        <label for="incidente">Descripción del Evento:</label>
        <textarea id="incidente" placeholder="Ingrese la descripción detallada del evento...">El día 22/09/2026, a las 15:20 horas, el colaborador Evel Tavara realizaba labores de pintado de un contenedor. La pistola se obstruyó y el trabajador procedió a ajustar la boquilla de forma manual sosteniendo el cuerpo con la mano derecha (dedos en el gatillo) y la mano izquierda frente a la boquilla. Accionó involuntariamente el gatillo, generando una descarga a presión que provocó una lesión superficial en su mano izquierda.</textarea>
        
        <div class="selector-tipo">
            <span style="font-weight: 600; font-size: 0.9rem;">Tipificación:</span>
            <label class="radio-label">
                <input type="radio" name="tipo_evento" value="accidente" checked onchange="actualizarInterfaz()"> Accidente de Trabajo (Análisis SCAT)
            </label>
            <label class="radio-label">
                <input type="radio" name="tipo_evento" value="incidente" onchange="actualizarInterfaz()"> Incidente / Casi-Accidente (5 Porqués)
            </label>
        </div>

        <label for="datos_extra">Datos adicionales / Precisiones del Investigador (Opcional):</label>
        <input type="text" id="datos_extra" placeholder="Ej: El colaborador no contaba con PETS firmado, la boquilla no se despresurizó, se omitió bloqueo LOTO...">

        <button class="btn-analizar" onclick="ejecutarAnalisisSST()">Generar Análisis Causa Raíz</button>
    </div>

    <div id="contenedor-resultados">
        <!-- Resultados generados dinámicamente -->
    </div>
</div>

<script>
function ejecutarAnalisisSST() {
    const texto = document.getElementById('incidente').value;
    const datosExtra = document.getElementById('datos_extra').value.trim();
    const esAccidente = document.querySelector('input[name="tipo_evento"]:checked').value === 'accidente';
    const contenedor = document.getElementById('contenedor-resultados');
    
    if (!texto.trim()) {
        alert("Por favor ingrese la descripción del evento.");
        return;
    }

    contenedor.innerHTML = "";

    if (esAccidente) {
        // Metodología SCAT (Systematic Cause Analysis Technique)
        const analisisSCAT = [
            {
                etapa: "1. EVALUACIÓN DE LA PÉRDIDA (Daño / Lesión)",
                clase: "critico",
                detalle: "Lesión personal de carácter superficial en extremidad superior (mano izquierda) ocasionada por inyección/contacto con fluido a presión."
            },
            {
                etapa: "2. EVENTO / INCIDENTE (Contacto con Energía)",
                clase: "",
                detalle: "Liberación intempestiva de energía neumática/hidráulica (descarga de pintura a alta presión) e impacto directo sobre la zona anatómica expuesta."
            },
            {
                etapa: "3. CAUSAS INMEDIATAS (Actos y Condiciones Subestándares)",
                clase: "",
                detalle: `• Acto Subestándar: Ubicación de la mano en la línea de fuego (frente a la boquilla) y manipulación de la herramienta manteniendo los dedos sobre el gatillo.
• Condición Subestándar: Equipo atascado/obstruido que requirió intervención no planificada.${datosExtra ? '\n• Aporte Adicional: ' + datosExtra : ''}`
            },
            {
                etapa: "4. CAUSAS BÁSICAS (Factores Personales y de Trabajo)",
                clase: "",
                detalle: "• Factores Personales: Práctica/hábito inadecuado al intentar corregir fallos sin aislamiento de energía; evaluar percepción del riesgo en la tarea.\n• Factores de Trabajo: Estándar operativo no adecuado o procedimiento de despresurización no clarificado en el puesto."
            },
            {
                etapa: "5. FALLA DE CONTROL (Falta de Control Administrativo / SCAT)",
                clase: "raiz",
                detalle: "Causa Raíz SCAT: Inadecuado cumplimiento del programa de capacitaciones prácticas en control de energías peligrosas y debilidad en los mecanismos de supervisión para detectar e intervenir actos subestándares en taller."
            }
        ];

        analisisSCAT.forEach(item => {
            const div = document.createElement('div');
            div.className = `scat-card ${item.clase}`;
            div.innerHTML = `
                <div class="scat-title">${item.etapa}</div>
                <div class="content-text" style="white-space: pre-line;">${item.detalle}</div>
            `;
            contenedor.appendChild(div);
        });

    } else {
        // Metodología 5 Porqués (Para Incidentes)
        const analisis5Porques = [
            {
                num: "1º Porqué",
                pregunta: "¿Por qué ocurrió el incidente?",
                respuesta: "Ocurrió una liberación intempestiva de fluido a alta presión desde la boquilla de la pistola de pintura mientras era manipulada."
            },
            {
                num: "2º Porqué",
                pregunta: "¿Por qué se liberó la presión hacia la posición del operario?",
                respuesta: "Porque el trabajador mantenía los dedos en el gatillo de accionamiento mientras posicionaba su mano en la línea de descarga del equipo."
            },
            {
                num: "3º Porqué",
                pregunta: "¿Por qué se realizó la maniobra en la línea de fuego?",
                respuesta: "Porque el operario intentó desobstruir la boquilla de forma inmediata sin realizar el protocolo previo de despresurización o bloqueo de la herramienta."
            },
            {
                num: "4º Porqué",
                pregunta: "¿Por qué no se ejecutó el procedimiento seguro?",
                respuesta: `Falta de adherencia a los estándares de trabajo seguro (PETS) e IPERC correspondientes a equipos con fluidos a presión.${datosExtra ? ' (' + datosExtra + ')' : ''}`
            },
            {
                num: "5º Porqué (Causa Raíz)",
                pregunta: "¿Por qué falló el control preventivo?",
                respuesta: "Causa Raíz: Ineficacia en la instrucción práctica sobre manipulación segura de equipos bajo presión y falta de seguimiento operativo para corregir desviaciones conductuales.",
                esRaiz: true
            }
        ];

        analisis5Porques.forEach(item => {
            const div = document.createElement('div');
            div.className = `porque-box ${item.esRaiz ? 'causa-raiz' : ''}`;
            div.innerHTML = `
                <span class="badge">${item.num}</span>
                <div>
                    <div style="font-weight:bold; color:#9ca3af; font-size:0.85rem; margin-bottom:2px;">${item.pregunta}</div>
                    <div class="content-text">${item.respuesta}</div>
                </div>
            `;
            contenedor.appendChild(div);
        });
    }
}

function actualizarInterfaz() {
    // Limpia o regenera al cambiar de tipo
    if (document.getElementById('contenedor-resultados').children.length > 0) {
        ejecutarAnalisisSST();
    }
}

// Ejecutar automáticamente al cargar
window.onload = ejecutarAnalisisSST;
</script>

</body>
</html>
